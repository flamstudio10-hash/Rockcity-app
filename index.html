<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rock City Training App</title>
<style>
:root{--bg:#000;--card:#151515;--y:#FFD400;--t:#fff;--m:#9a9a9a;--ok:#3ddc84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;padding-bottom:84px}
header{text-align:center;padding:10px 0 2px}header img{width:84px;height:84px}
h2{color:var(--y);font-size:26px;margin:14px 16px 8px;letter-spacing:.5px}
.page{display:none;padding:0 12px}.page.on{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center}
.card b{color:var(--y);font-size:19px}svg{max-width:100%;height:auto}
.g2{grid-template-columns:repeat(2,1fr)}.card small{display:block;color:#9a9a9a;font-size:14px}.sc{background:var(--card);border-radius:10px;padding:10px;margin-bottom:10px;overflow-x:auto}.sc b{color:var(--y)}
.song{display:block;width:100%;background:var(--card);color:var(--t);border:0;border-left:4px solid var(--y);border-radius:8px;padding:12px;margin-bottom:8px;text-align:left;font:inherit;font-size:19px}
.song small{color:var(--m);display:block;font-size:14px}
.row{display:flex;gap:4px;margin:4px 0;flex-wrap:wrap}.row i{font-style:normal;font-weight:700;background:#222;border:1px solid #555;border-radius:5px;min-width:52px;padding:6px 8px;text-align:center;font-size:18px}
.row u{color:var(--y);align-self:center;margin-left:4px;text-decoration:none}
.lab{color:var(--y);font-weight:700;margin:12px 0 2px}
.back{background:none;border:0;color:var(--y);font:inherit;font-size:18px;padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--y);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:14px 0;font:inherit;font-weight:700;font-size:15px;color:#000}nav button.on{background:#000;color:var(--y)}
#note{font-size:120px;font-weight:700;color:var(--y);text-align:center;line-height:1;margin:10px 0 0}
#hz{text-align:center;color:var(--m);height:22px}
#bar{position:relative;height:16px;margin:16px 10px;background:#222;border-radius:8px}#bar:before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;background:#fff}
#dot{position:absolute;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--m);left:50%;margin-left:-12px;transition:left .1s}
#msg{text-align:center;color:var(--m);margin:8px 16px;min-height:40px}
.btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.btns button{font:inherit;font-weight:700;font-size:20px;min-width:48px;padding:10px 12px;border-radius:8px;border:1px solid #555;background:var(--card);color:var(--t)}
.btns button.on{background:var(--y);color:#000;border-color:var(--y)}
.go{display:block;margin:14px auto;font:inherit;font-weight:700;font-size:22px;padding:14px 40px;border:0;border-radius:10px;background:var(--y);color:#000}
</style></head><body>

const CH=[['C',[-1,3,2,0,1,0],[0,3,2,0,1,0]],['D',[-1,-1,0,2,3,2],[0,0,0,1,3,2]],['E',[0,2,2,1,0,0],[0,2,3,1,0,0]],['G',[3,2,0,0,3,3],[2,1,0,0,3,4]],['A',[-1,0,2,2,2,0],[0,0,1,2,3,0]],['Am',[-1,0,2,2,1,0],[0,0,2,3,1,0]],['Dm',[-1,-1,0,2,3,1],[0,0,0,2,3,1]],['Em',[0,2,2,0,0,0],[0,2,3,0,0,0]],['F (mini)',[-1,-1,3,2,1,1],[0,0,3,2,1,1]],['A7',[-1,0,2,0,2,0],[0,0,2,0,3,0]],['D7',[-1,-1,0,2,1,2],[0,0,0,2,1,3]],['E7',[0,2,0,1,0,0],[0,2,0,1,0,0]],['B7',[-1,2,1,2,0,2],[0,2,1,3,0,4]],['Cmaj7',[-1,3,2,0,0,0],[0,3,2,0,0,0]],['Am7',[-1,0,2,0,1,0],[0,0,2,0,1,0]],['Em (1 finger)',[-1,-1,2,0,0,0],[0,0,1,0,0,0]]];
const cd=(n,f,g)=>{const sp=60/(n-1);let s='<svg viewBox="0 0 80 100">';for(let i=0;i<n;i++){const x=10+i*sp;s+=`<line x1="${x}" y1="18" x2="${x}" y2="88" stroke="#fff" stroke-width=".8"/>`;if(f[i]<0)s+=`<text x="${x}" y="13" fill="#888" font-size="9" text-anchor="middle">x</text>`;else if(!f[i])s+=`<circle cx="${x}" cy="9" r="3" fill="none" stroke="#fff"/>`;else{const y=18+(f[i]-.5)*14;s+=`<circle cx="${x}" cy="${y}" r="5.5" fill="${Y}"/>${g[i]?`<text x="${x}" y="${y+3.5}" font-size="9" font-weight="700" text-anchor="middle">${g[i]}</text>`:''}`}}
for(let j=0;j<6;j++)s+=`<line x1="10" y1="${18+j*14}" x2="70" y2="${18+j*14}" stroke="#fff" stroke-width="${j?.8:3}"/>`;return s+'</svg>'};

return`<div class="card"><b>${n}</b>${s}${k}</svg><small>${a.map(x=>NM[x%12]).join('  ')}</small></div>`}).join('');
function fb(t,S,f0,N,R){const w=340,l=24,fw=(w-l-8)/4,sh=18,n=S.length,h=n*sh+20;let s=`<svg viewBox="0 0 ${w} ${h}">`;
for(let i=0;i<n;i++){const y=8+(n-1-i)*sh;s+=`<line x1="${l}" y1="${y}" x2="${w-8}" y2="${y}" stroke="#fff" stroke-width=".8"/><text x="8" y="${y+4}" fill="#fff" font-size="11">${S[i]}</text>`;
(N[i]||[]).forEach(f=>{const x=l+(f-f0+.5)*fw,r=R.some(a=>a[0]==i&&a[1]==f);s+=`<circle cx="${x}" cy="${y}" r="7" fill="${r?Y:'#000'}" stroke="${r?Y:'#fff'}" stroke-width="1.5"/>${r?`<text x="${x}" y="${y+3.5}" font-size="9" font-weight="700" text-anchor="middle">R</text>`:''}`})}
for(let f=0;f<=4;f++)s+=`<line x1="${l+f*fw}" y1="8" x2="${l+f*fw}" y2="${8+(n-1)*sh}" stroke="#fff" stroke-width=".8"/>`;
for(let f=0;f<4;f++)s+=`<text x="${l+(f+.5)*fw}" y="${h-2}" fill="#888" font-size="10" text-anchor="middle">${f0+f}</text>`;
return`<div class="sc"><b>${t}</b>${s}</svg></div>`}
const g=['E','A','D','G','B','e'],b=['E','A','D','G'];
$('scales').innerHTML=fb('Guitar - A minor pentatonic',g,5,{0:[5,8],1:[5,7],2:[5,7],3:[5,7],4:[5,8],5:[5,8]},[[0,5],[2,7],[5,5]])+fb('Guitar - C major (open)',g,0,{0:[0,1,3],1:[0,2,3],2:[0,2,3],3:[0,2],4:[0,1,3],5:[0,1,3]},[[1,3],[4,1]])+fb('Bass - A minor pentatonic',b,5,{0:[5,8],1:[5,7],2:[5,7],3:[5,7]},[[0,5],[2,7]])+fb('Bass - C major (frets 2-5)',b,2,{0:[3,5],1:[2,3,5],2:[2,3,5],3:[2,4,5]},[[1,3],[3,5]])+'<p style="color:#888;font-size:14px">Yellow R = root note. Low string at the bottom.</p>';

const SG=[
['נגעה בשמיים','A minor',[['Verse',[...rp('Am C F Am',7),'Am C F']],['Chorus',rp('Am C F',4)],['Bridge x2',['(chords to be added)']]]],
['עיר מקלט','E minor',[['Verse',['Em Am','Em Am','Em Am Em Am','Em Am','Em Am','Em Am','Em Am']],['Chorus',['Em Am Em Am']]]],
['השכן שלא ישן','G major',[['Intro',['G C D G x4']],['Verse 1',rp('G C D G',4)],['Chorus',rp('G C D G C D G',2)],['Verse 2',[...rp('G C D G',3),'C D G']],['Solo',['G D C G x4']]]],
['ואיך שלא','G major / E minor',[['Part A',rp('Em D C G',4)],['Part B',['Em D','C G','Em D','C G']],['Part C',rp('Em D C G',4)],['Part D',['Em D','C G','Em D C G','Em D C G']],['Ending',['Em D C G']]]]];
const N='Simplified progression from memory - check the exact bars by ear.';

['Let It Be','C major',[['Verse',['C G Am F','C G F C']],['Chorus',['Am G F C','C G F C']]],N],
['Imagine','C major',[['Verse',['C Cmaj7 F','C Cmaj7 F']],['Chorus',['F G C E7','F G C']]],N],
['Stand By Me','G major',[['Loop (whole song)',['G Em C D']]],N],
['Three Little Birds','A major',[['Chords used',['A D E']]],'Only the chords are listed - bars not added yet.'],
['Sweet Home Alabama','D major',[['Loop (whole song)',['D C G']]],N],
['Wild Thing','A major',[['Loop (whole song)',['A D E D']]],N],
['Hey Joe','C major',[['Loop (whole song)',['C G D A E']]],N],
['Zombie','E minor',[['Loop (whole song)',['Em C G D']]],N],
['House of the Rising Sun','A minor',[['Verse',['Am C D F','Am E Am E']]],N],
['Hallelujah','C major',[['Verse',['C Am C Am','F G C G','C F G','Am F','G E7 Am']],['Chorus',['F Am','F C','G C G']]],N],
['Take Me Home, Country Roads','G major',[['Verse',['G Em D C','G Em D C']],['Chorus',['G D Em C','G D C G']]],N],

const L=$('songs');function list(){L.innerHTML=SG.map((s,i)=>(i==0?'<div class="lab">Hebrew</div>':i==4?'<div class="lab">English</div>':'')+`<button class="song" data-i="${i}" dir="auto">${s[0]}<small>${s[1]}</small></button>`).join('');L.querySelectorAll('.song').forEach(e=>e.onclick=()=>show(+e.dataset.i))}
function show(i){const s=SG[i];L.innerHTML=`<button class="back">&lt; All songs</button><h2 dir="auto" style="margin:4px 0">${s[0]}</h2><div style="color:#9a9a9a">Key: ${s[1]}. Each box is one chord.</div>`+s[2].map(([l,r])=>`<div class="lab">${l}</div>`+r.map(x=>{const m=x.match(/^(.*?)( x\d)?$/);return m[1].startsWith('(')?`<div style="color:#9a9a9a">${x}</div>`:`<div class="row">${m[1].split(' ').map(c=>`<i>${c}</i>`).join('')}${m[2]?`<u>${m[2]}</u>`:''}</div>`}).join('')).join('')+`<p style="color:#9a9a9a;font-size:14px">${s[3]||''}</p>`;L.querySelector('.back').onclick=list}list();
const tabs=document.querySelectorAll('nav button');tabs.forEach((t,i)=>t.onclick=()=>{tabs.forEach((x,j)=>{x.classList.toggle('on',i==j);$('p'+j).classList.toggle('on',i==j)});if(i!=5)stop()});
let mode='mG',ctx,an,tm,st;
const TS={mG:['E2','A2','D3','G3','B3','E4'],mB:['E1','A1','D2','G2'],mU:['G4','C4','E4','A4']},STR=()=>TS[mode];
function drawS(a){$('strs').innerHTML=STR().map(x=>`<button class="${x==a?'on':''}">${x}</button>`).join('')}drawS();
['mG','mB','mU'].forEach(id=>$(id).onclick=()=>{mode=id;['mG','mB','mU'].forEach(x=>$(x).classList.toggle('on',x==id));drawS()});
function pitch(b,sr){let n=b.length,r=0;for(let i=0;i<n;i++)r+=b[i]*b[i];if(Math.sqrt(r/n)<.012)return -1;const c=new Float32Array(n/2);for(let i=0;i<n/2;i++){let s=0;for(let j=0;j<n/2;j++)s+=b[j]*b[j+i];c[i]=s}
let d=0;while(d<c.length-1&&c[d]>c[d+1])d++;let m=-1,p=-1;for(let i=d;i<c.length-1;i++)if(c[i]>m){m=c[i];p=i}if(p<1||p>=c.length-1)return -1;const a=(c[p-1]+c[p+1]-2*c[p])/2,q=(c[p+1]-c[p-1])/2;return sr/(a?p-q/(2*a):p)}
async function start(){try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){$('msg').textContent='Microphone blocked. Allow it in your browser settings, or open this page in Safari or Chrome.';return}
ctx=new (window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=4096;ctx.createMediaStreamSource(st).connect(an);const buf=new Float32Array(4096);$('msg').textContent='Listening...';$('go').textContent='Stop tuner';
tm=setInterval(()=>{an.getFloatTimeDomainData(buf);const f=pitch(buf,ctx.sampleRate);if(f<30||f>1200)return;const x=12*Math.log2(f/440)+69,r=Math.round(x),c=Math.round((x-r)*100),nm=NM[r%12],name=nm+(Math.floor(r/12)-1);
$('note').textContent=nm;$('hz').textContent=f.toFixed(1)+' Hz  '+(c>0?'+':'')+c+' cents';$('dot').style.left=(50+Math.max(-50,Math.min(50,c))*.9)+'%';$('dot').style.background=Math.abs(c)<6?'#3ddc84':Y;drawS(name);
$('msg').textContent=Math.abs(c)<6?'In tune':c<0?'Too low - tighten the string':'Too high - loosen the string'},120)}
function stop(){clearInterval(tm);if(st)st.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();st=ctx=null;$('go').textContent='Start tuner'}
$('go').onclick=()=>st?stop():start();
